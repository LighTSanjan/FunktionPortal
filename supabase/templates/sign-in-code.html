<!--
  Paste into Supabase: Authentication → Emails → Templates, into BOTH
  "Magic Link" and "Confirm signup" (subject: "Your FUNKtion sign-in code").

  The code, not a link, is what the portal asks for. Outlook's Safe Links
  opens every link in an email before the person does, and a one-time link
  that has been opened once no longer works.
-->
<div style="font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #17192B;">
  <p style="font-size: 15px; margin: 0 0 16px;">Your code for the FUNKtion portal:</p>
  <p style="font-size: 34px; font-weight: 700; letter-spacing: 8px; font-family: 'SF Mono', Menlo, Consolas, monospace; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="font-size: 13px; color: #5A5F72; margin: 0 0 8px;">Type it into the sign-in page. It works once and expires in an hour.</p>
  <p style="font-size: 13px; color: #5A5F72; margin: 0;">Didn't ask for this? Ignore it — nobody can sign in without the code.</p>
</div>
