<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<meta name="supported-color-schemes" content="light">
<title>Your FUNKtion sign-in code</title>
<style>
  /* A touch smaller on a phone. Clients that ignore this keep 220px. */
  @media only screen and (max-width: 480px) {
    .logo { width: 180px !important; }
  }
</style>
<!--
  The sign-in email. Paste this whole file into Supabase → Authentication →
  Emails → Templates, into BOTH "Magic Link" and "Confirm signup", with the
  subject "Your FUNKtion sign-in code".

  A code and not a link: Outlook's Safe Links opens every link in an email
  before the person does, and a one-time link opened once no longer works.

  Built for email clients, which are not browsers: tables for layout, every
  style inline, no SVG, no web fonts. The images load from the portal's public
  email-assets route. Supabase replaces SiteURL with the configured public app
  URL, so local Mailpit and production use the same template.
-->
</head>
<body style="margin:0; padding:0; background-color:#FBF8F3;">
  <!-- Inbox preview line. Plain text only: invisible padding characters and
       background-coloured text are filter-evasion tricks, and Microsoft 365
       scores them as phishing. -->
  <div style="display:none; max-height:0; overflow:hidden;">
    Your FUNKtion Portal code is {{ .Token }}
  </div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FBF8F3;">
    <!-- The band: the logo's four inks. -->
    <tr>
      <td>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td width="25%" height="8" style="background-color:#F05B23; font-size:0; line-height:0;">&nbsp;</td>
            <td width="25%" height="8" style="background-color:#FBAE3A; font-size:0; line-height:0;">&nbsp;</td>
            <td width="25%" height="8" style="background-color:#5BC5EF; font-size:0; line-height:0;">&nbsp;</td>
            <td width="25%" height="8" style="background-color:#344D90; font-size:0; line-height:0;">&nbsp;</td>
          </tr>
        </table>
      </td>
    </tr>

    <tr>
      <td align="center" style="padding:28px 16px 48px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;">

          <!-- Logo -->
          <tr>
            <td align="center" style="padding:0 0 22px;">
              <img src="{{ .SiteURL }}/api/email-assets/logo"
                   width="220" alt="FUNKtion" class="logo" style="display:block; width:220px; max-width:60%; height:auto; border:0;">
            </td>
          </tr>

          <!-- The card, sitting on the logo's stack: marigold, sky, indigo. -->
          <tr>
            <td style="background-color:#344D90; border-radius:20px; padding:0 5px 5px 0;">
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="background-color:#5BC5EF; border-radius:18px; padding:0 5px 5px 0;">
                    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td style="background-color:#FBAE3A; border-radius:17px; padding:0 5px 5px 0;">
                          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#FFFFFF; border:2px solid #111114; border-radius:16px;">
                            <tr>
                              <td style="padding:32px 32px 30px; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color:#17192B;">
                                <p style="margin:0 0 6px; font-size:12px; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#F05B23;">
                                  FUNKtion Portal
                                </p>
                                <h1 style="margin:0 0 10px; font-size:28px; line-height:1.15; font-weight:800; letter-spacing:-0.5px; color:#111114;">
                                  Here&rsquo;s your code &#9996;&#65039;
                                </h1>
                                <p style="margin:0 0 22px; font-size:15px; line-height:1.55; color:#5A5F72;">
                                  Type it into the sign-in page and you&rsquo;re in.
                                </p>

                                <!-- The code -->
                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                                  <tr>
                                    <td align="center" style="background-color:#FEF2EC; border:2px solid #111114; border-radius:14px; padding:18px 8px;">
                                      <span style="font-family:'SF Mono', Menlo, Consolas, 'Courier New', monospace; font-size:38px; line-height:1; font-weight:700; letter-spacing:10px; color:#111114;">{{ .Token }}</span>
                                    </td>
                                  </tr>
                                </table>

                                <p style="margin:18px 0 0; font-size:13px; line-height:1.55; color:#5A5F72;">
                                  It works once and expires in an hour.
                                </p>

                                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="margin-top:22px;">
                                  <tr>
                                    <td style="border-top:1px solid #E8E0D2; padding-top:16px; font-size:13px; line-height:1.55; color:#8A8E9E;">
                                      Didn&rsquo;t ask for this? Ignore it.
                                    </td>
                                  </tr>
                                </table>
                              </td>
                            </tr>
                          </table>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- The crew -->
          <tr>
            <td style="padding:36px 0 0;">
              <img src="{{ .SiteURL }}/api/email-assets/crew"
                   width="520" alt="The FUNKtion crew" style="display:block; width:100%; max-width:520px; height:auto; border:2px solid #111114; border-radius:16px;">
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:14px 8px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:14px; line-height:1.5; color:#17192B; font-weight:600;">
              See you next session!
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:22px 8px 0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size:12px; line-height:1.6; color:#8A8E9E;">
              FUNKtion - SUTD&rsquo;s Ultimate Popping &amp; Locking Dance Club!
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
